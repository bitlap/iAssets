# 配置 Dart 静态分析器，用于检查代码错误、警告和规范问题。
#
# 检查结果可在支持 Dart 的开发工具中查看，也可运行 flutter analyze。
# 开发工具说明：https://dart.dev/tools#ides-and-editors

# 启用 Flutter 应用、软件包和插件的推荐代码规范。
include: package:flutter_lints/flutter.yaml

linter:
  # 可在下方禁用推荐规则，或启用其他检查规则。
  # 完整规则列表及文档：https://dart.dev/lints
  #
  # 若仅需忽略某行或某个文件的规则，可在相应位置使用
  # // ignore: name_of_lint 或 // ignore_for_file: name_of_lint，
  # 无需在整个项目中禁用该规则。
  rules:
    # avoid_print: false  # 取消注释可禁用 avoid_print 规则
    # prefer_single_quotes: true  # 取消注释可启用 prefer_single_quotes 规则

# 本文件的更多配置说明：
# https://dart.dev/guides/language/analysis-options
