name: Release Drafter

# master 更新时创建/更新 Release 草稿，正文从对应版本的全语言 changelog 提取中简、中繁和英文。
# 版本号直接取自 pubspec.yaml（如 1.5.0 → v1.5.0），无需给 PR 打标签
# 配置见 .github/release-drafter.yml
on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-drafter
  cancel-in-progress: false

jobs:
  update_release_draft:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve version from pubspec.yaml
        id: version
        run: |
          VERSION=$(grep -E '^version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
          python3 scripts/check_release_notes.py --version "$VERSION"
          python3 scripts/github_release_notes.py --version "$VERSION" --output "$RUNNER_TEMP/github-release-notes.md"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check whether this version is already published
        id: published
        uses: actions/github-script@v7
        env:
          RELEASE_NOTES_PATH: ${{ runner.temp }}/github-release-notes.md
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        with:
          script: |
            const fs = require('node:fs');
            const tag = process.env.RELEASE_TAG;
            let published;
            let publishedRelease;
            try {
              const result = await github.rest.repos.getReleaseByTag({...context.repo, tag});
              publishedRelease = result.data;
              published = !result.data.draft;
            } catch (error) {
              if (error.status !== 404) throw error;
              published = false;
            }
            core.setOutput('exists', String(published));
            if (!published) return;
            core.notice(`${tag} is published; skipping draft creation`);
            // Remove only an identical, empty-asset bot draft left by the old workflow.
            // Its full notes remain in both the published release and versioned changelog.
            const body = fs.readFileSync(process.env.RELEASE_NOTES_PATH, 'utf8').trim();
            const normalize = text => (text || '').replace(/\r\n/g, '\n').trim();
            if (normalize(publishedRelease.body) !== normalize(body)) return;
            const releases = await github.paginate(github.rest.repos.listReleases, {...context.repo, per_page: 100});
            for (const release of releases) {
              if (release.draft && (release.tag_name === tag || release.name === tag)) {
                core.notice(JSON.stringify({draftId: release.id, tag: release.tag_name, name: release.name, author: release.author?.login, assets: release.assets.length, notesMatch: normalize(release.body) === normalize(body)}));
              }
              if (release.draft && (release.tag_name === tag || /^untagged-[0-9a-f]+$/.test(release.tag_name)) && release.name === tag &&
                  release.author?.login === 'github-actions[bot]' && release.assets.length === 0 &&
                  normalize(release.body) === normalize(body)) {
                await github.rest.repos.deleteRelease({...context.repo, release_id: release.id});
                core.notice(`Removed redundant automated draft ${release.id}`);
              }
            }

      - name: Update Release Draft
        if: steps.published.outputs.exists != 'true'
        id: drafter
        uses: release-drafter/release-drafter@v6
        with:
          name: ${{ steps.version.outputs.tag }}
          tag: ${{ steps.version.outputs.tag }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync release notes from changelog
        if: steps.published.outputs.exists != 'true'
        uses: actions/github-script@v7
        env:
          RELEASE_NOTES_PATH: ${{ runner.temp }}/github-release-notes.md
          RELEASE_ID: ${{ steps.drafter.outputs.id }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        with:
          script: |
            const fs = require('node:fs');
            const version = process.env.RELEASE_VERSION;
            const releaseId = Number(process.env.RELEASE_ID);
            if (!/^\d+\.\d+\.\d+$/.test(version) || !Number.isSafeInteger(releaseId) || releaseId <= 0) {
              throw new Error('Invalid release version or draft ID');
            }
            const body = fs.readFileSync(process.env.RELEASE_NOTES_PATH, 'utf8').trim();
            const {data: release} = await github.rest.repos.getRelease({
              ...context.repo, release_id: releaseId,
            });
            if (!release.draft) {
              core.notice('Release already published; keeping its notes unchanged');
              return;
            }
            if (release.tag_name !== `v${version}`) {
              throw new Error('Draft tag does not match changelog version');
            }
            await github.rest.repos.updateRelease({
              ...context.repo, release_id: releaseId, body,
            });
            core.notice(`Updated draft v${version} with Chinese and English sections from changelog/${version}.md`);
