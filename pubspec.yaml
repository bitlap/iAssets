name: assets
description: "看清资产，轻松记录"
# 禁止通过 flutter pub publish 意外将此私有项目发布到 pub.dev。
publish_to: 'none' # 如需发布到 pub.dev，可删除本行

# 应用版本格式为 主版本.次版本.修订版本+构建号，例如 1.2.43+1。
# 构建时可用 --build-name 和 --build-number 分别覆盖版本号与构建号。
# Android 分别映射为 versionName 与 versionCode。
# Android 版本说明：https://developer.android.com/studio/publish/versioning
# iOS 分别映射为 CFBundleShortVersionString 与 CFBundleVersion。
# iOS 版本说明：
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# Windows 使用版本号作为产品和文件版本的前三段，构建号作为后缀。
version: 2.2.0+10

environment:
  sdk: ^3.12.2

# 项目运行所需的依赖，可手动修改版本，或通过
# flutter pub upgrade --major-versions 升级至最新主版本。
# 运行 flutter pub outdated 可检查可用更新。
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  intl: ^0.20.2
  http: ^1.2.0
  url_launcher: ^6.2.0
  path_provider: ^2.1.0
  package_info_plus: ^10.2.1
  workmanager: ^0.9.0+3
  image_picker: ^1.2.3
  file_picker: ^13.1.0
  crypto: ^3.0.7
  decimal: ^3.2.6
  local_auth: ^3.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  # 推荐代码规范在根目录的 analysis_options.yaml 中启用，
  # 也可在该文件中调整具体检查规则。
  flutter_lints: ^6.0.0

# 通用 Dart 配置说明：https://dart.dev/tools/pub/pubspec

# 以下为 Flutter 专用配置。
flutter:

  # 将 Material 图标字体打包到应用中，供 Icons 类使用。
  uses-material-design: true
